# Accessibility API contract (shapes and wire names only). Behaviour lives in spec.md.
# Wire names are exactly as sent/received. Event subscriptions are implicit: the transport adds the `listen` param.
# kind: omitted = call; property = read-only getter; event = subscription.

module: Accessibility
header: include/firebolt/accessibility.h
interface: Firebolt::Accessibility::IAccessibility
description: |-
  The `Accessibility` module provides access to the user/device settings for closed captioning and voice guidance.

  Apps **SHOULD** attempt o respect these settings, rather than manage and persist seprate settings, which would be different per-app.
types:
- name: Accessibility.ClosedCaptionsSettings
  type: object
  fields:
  - {name: enabled, type: boolean, required: true, description: Whether or not closed-captions should be enabled by default}
  - {name: preferredLanguages, type: array<Localization.ISO639_2Language>}
- {name: Accessibility.SpeechRate, type: number, minimum: 0.1, maximum: 10}
- name: Accessibility.VoiceGuidanceSettings
  type: object
  fields:
  - {name: enabled, type: boolean, required: true, description: Whether or not voice guidance should be enabled by default}
  - {name: rate, type: Accessibility.SpeechRate, required: true, description: The rate at which voice guidance speech will be read back to the
      user}
  - {name: navigationHints, type: boolean, required: true, description: Whether or not voice guidance should include additional navigation hints}
methods:
- name: Accessibility.audioDescription
  cpp: audioDescription
  kind: property
  summary: Returns the audio description setting of the device
  result: boolean
  examples:
  - {result: true}
- name: Accessibility.closedCaptionsSettings
  cpp: closedCaptionsSettings
  kind: property
  summary: 'Returns captions settings: enabled, and a list of zero or more languages in order of decreasing preference'
  result: Accessibility.ClosedCaptionsSettings
  examples:
  - result:
      enabled: true
      preferredLanguages: [eng, spa]
- name: Accessibility.highContrastUI
  cpp: highContrastUI
  kind: property
  summary: Returns the high contrast UI device setting
  result: boolean
  examples:
  - {result: true}
- name: Accessibility.voiceGuidanceSettings
  cpp: voiceGuidanceSettings
  kind: property
  summary: 'Returns voice guidance settings: enabled, rate, and verbosity'
  result: Accessibility.VoiceGuidanceSettings
  examples:
  - result: {enabled: true, rate: 0.8, navigationHints: true}
- {name: Accessibility.onAudioDescriptionChanged, cpp: subscribeOnAudioDescriptionChanged, kind: event, summary: Returns the audio description
    setting of the device, payload_of: Accessibility.audioDescription, result: boolean}
- {name: Accessibility.onClosedCaptionsSettingsChanged, cpp: subscribeOnClosedCaptionsSettingsChanged, kind: event, summary: 'Returns captions
    settings: enabled, and a list of zero or more languages in order of decreasing preference', payload_of: Accessibility.closedCaptionsSettings,
  result: Accessibility.ClosedCaptionsSettings}
- {name: Accessibility.onHighContrastUIChanged, cpp: subscribeOnHighContrastUIChanged, kind: event, summary: Returns the high contrast UI device
    setting, payload_of: Accessibility.highContrastUI, result: boolean}
- {name: Accessibility.onVoiceGuidanceSettingsChanged, cpp: subscribeOnVoiceGuidanceSettingsChanged, kind: event, summary: 'Returns voice guidance
    settings: enabled, rate, and verbosity', payload_of: Accessibility.voiceGuidanceSettings, result: Accessibility.VoiceGuidanceSettings}
