# Advertising contract. Field guide: openspec/README.md
module: Advertising
description: Platform provided advertising settings.
types:
  Ifa:
    fields:
      ifa: {type: string, description: The advertising identifier, a UUID}
      ifa_type: {type: string, values: [dpid, sspid, sessionid], description: "dpid: device provided ID; sspid: SSP provided ID; sessionid: session/synthetic ID"}
      lmt: {type: string, values: ["0", "1"], description: "Limit ad tracking: \"0\" disabled, \"1\" enabled"}
methods:
  advertisingId:
    summary: Returns the identifier for advertising (IFA)
    result: Ifa
    examples: [{result: {ifa: bd87dd10-8d1d-4b93-b1a6-a8e5d410e400, ifa_type: sspid, lmt: "0"}}]
