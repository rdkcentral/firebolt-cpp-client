# Device API contract (shapes and wire names only). Behaviour lives in spec.md.
# Wire names are exactly as sent/received. Event subscriptions are implicit: the transport adds the `listen` param.
# kind: omitted = call; property = read-only getter; event = subscription.

module: Device
header: include/firebolt/device.h
interface: Firebolt::Device::IDevice
description: A module for querying about the device and it's capabilities.
types:
- name: DeviceClass
  type: string
  enum: [ott, stb, tv]
  description: The type of device
- name: HDRFormatMap
  type: object
  fields:
  - {name: hdr10, type: boolean, required: true}
  - {name: hdr10Plus, type: boolean, required: true}
  - {name: dolbyVision, type: boolean, required: true}
  - {name: hlg, type: boolean, required: true}
  description: The type of HDR format
methods:
- name: Device.uid
  cpp: uid
  summary: Returns a persistent unique UUID for the current app and device. The UUID is reset when the app or device is reset
  result: string
  examples:
  - {result: ee6723b8-7ab3-462c-8d93-dbf61227998e}
- name: Device.deviceClass
  cpp: deviceClass
  summary: Returns the class of the device
  result: DeviceClass
  examples:
  - {result: ott}
- name: Device.osName
  cpp: osName
  summary: Returns the operating system name as defined by the operator
  result: string
  examples:
  - {result: Linux}
- name: Device.setOsName
  cpp: setOsName
  summary: Sets the operating system name as defined by the operator
  params:
  - {name: value, type: string, required: true, description: The operating system name}
  result: 'null'
  examples:
  - params: {value: Linux}
    result: null
- name: Device.osVersion
  cpp: osVersion
  summary: Returns the operating system version as defined by the operator
  result: string
  examples:
  - {result: 5.15.0}
- name: Device.setOsVersion
  cpp: setOsVersion
  summary: Sets the operating system version as defined by the operator
  params:
  - {name: value, type: string, required: true, description: The operating system version}
  result: 'null'
  examples:
  - params: {value: 5.15.0}
    result: null
- name: Device.firmware
  cpp: firmware
  summary: Returns a string that identifies the firmware image of the device
  result: string
  examples:
  - {result: 1.0.0-20240101}
- name: Device.uptime
  cpp: uptime
  summary: Returns the number of seconds since most recent device boot, including any time spent during deep sleep
  result: number
  examples:
  - {result: 123456}
- name: Device.timeInActiveState
  cpp: timeInActiveState
  summary: Returns the number of seconds since the device transitioned to the ON power state
  result: number
  examples:
  - {result: 654321}
- name: Device.chipsetId
  cpp: chipsetId
  summary: Returns chipset ID as a printable string, e.g. BCM72180
  result: string
  examples:
  - {result: BCM72180}
- name: Device.hdr
  cpp: hdr
  kind: property
  summary: Returns the HDR standards that are supported by the attached TV or the integral display
  result: HDRFormatMap
  examples:
  - result: {hdr10: true, hdr10Plus: true, dolbyVision: true, hlg: true}
- name: Device.dolbyAtmosExperienceAvailable
  cpp: dolbyAtmosExperienceAvailable
  kind: property
  summary: Returns whether Dolby Atmos experience is available on the device
  result: boolean
  examples:
  - {result: true}
- name: Device.name
  cpp: name
  kind: property
  summary: Returns the device friendly name
  result: string
  examples:
  - {result: Living Room TV}
- {name: Device.onHdrChanged, cpp: subscribeOnHdrChanged, kind: event, summary: Returns the HDR standards that are supported by the attached TV
    or the integral display, payload_of: Device.hdr, result: HDRFormatMap}
- {name: Device.onDolbyAtmosExperienceAvailableChanged, cpp: subscribeOnDolbyAtmosExperienceAvailableChanged, kind: event, summary: Returns whether
    Dolby Atmos experience is available on the device, payload_of: Device.dolbyAtmosExperienceAvailable, result: boolean}
- {name: Device.onNameChanged, cpp: subscribeOnNameChanged, kind: event, summary: Returns the device friendly name, payload_of: Device.name, result: string}
