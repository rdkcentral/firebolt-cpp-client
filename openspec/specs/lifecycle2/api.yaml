# Lifecycle2 API contract (shapes and wire names only). Behaviour lives in spec.md.
# Wire names are exactly as sent/received. Event subscriptions are implicit: the transport adds the `listen` param.
# kind: omitted = call; property = read-only getter; event = subscription.

module: Lifecycle2
header: include/firebolt/lifecycle.h
interface: Firebolt::Lifecycle::ILifecycle
description: Methods and events for responding to Lifecycle changes in your app.
types:
- name: CloseType
  type: string
  enum: [deactivate, unload, killReload, killReactivate]
  description: The application close type
- name: LifecycleState
  type: string
  enum: [initializing, active, paused, suspended, hibernated, terminating]
  description: The application Lifecycle state
- name: StateChange
  type: object
  fields:
  - {name: oldState, type: LifecycleState, required: true}
  - {name: newState, type: LifecycleState, required: true}
methods:
- name: Lifecycle2.close
  cpp: close
  summary: Request the platform to deactivate the app, and possibly take further action.
  params:
  - {name: type, type: CloseType, required: true, description: The type of the close app is requesting}
  result: 'null'
  examples:
  - params: {type: unload}
    result: null
- name: Lifecycle2.state
  cpp: state
  summary: Get the current lifecycle state of the app.
  result: LifecycleState
  examples:
  - {result: active}
- {name: Lifecycle2.onStateChanged, cpp: subscribeOnStateChanged, kind: event, summary: 'Notification of lifecycle state change, raised after
    the platform has transitioned the app/runtime to the new lifecycle state. The list always carries exactly one state change', result: 'array<StateChange> (exactly one item)'}
