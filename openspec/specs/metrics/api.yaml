# Metrics contract. Field guide: openspec/README.md
module: Metrics
description: Sending metrics events to the platform. No call returns a value.
types:
  ErrorType:
    enum: {network: Network, media: Media, restriction: Restriction, entitlement: Entitlement, other: Other}
    description: The kind of error that occurred in the app
methods:
  ready:
    summary: Informs the platform that the app is minimally usable
  signIn:
    summary: Logs a sign in event
  signOut:
    summary: Logs a sign out event
  startContent:
    summary: Informs the platform that the user started content
    params:
      entityId: {type: string, optional: true, description: Entity ID of the content}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345"}}]
  stopContent:
    summary: Informs the platform that the user stopped content
    params:
      entityId: {type: string, optional: true, description: Entity ID of the content}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345"}}]
  page:
    summary: Informs the platform that the user navigated to a page or view
    params:
      pageId: {type: string, description: Page ID of the content}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {pageId: xyz}}]
  error:
    summary: Informs the platform of an error that occurred in the app
    params:
      type: {type: ErrorType}
      code: {type: string, description: An app-specific error code}
      description: {type: string, description: A short description of the error}
      visible: {type: boolean, description: Whether the user saw the error}
      parameters: {type: "map<string>", optional: true, description: Additional parameters to log with the error}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {type: media, code: MEDIA-STALLED, description: playback stalled, visible: true}}]
  mediaLoadStart:
    summary: The URL of a media asset was set, in order to infer load time
    params:
      entityId: {type: string, description: Entity ID of the media}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345"}}]
  mediaPlay:
    summary: Media playback should start, due to autoplay, a user play or unpausing
    params:
      entityId: {type: string, description: Entity ID of the media}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345"}}]
  mediaPlaying:
    summary: Media playback actually started, after autoplay, a user play, unpausing or recovering from buffering
    params:
      entityId: {type: string, description: Entity ID of the media}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345"}}]
  mediaPause:
    summary: Media playback will pause because of an intentional pause
    params:
      entityId: {type: string, description: Entity ID of the media}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345"}}]
  mediaWaiting:
    summary: Media playback will halt because of a network, buffer or other unintentional constraint
    params:
      entityId: {type: string, description: Entity ID of the media}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345"}}]
  mediaSeeking:
    summary: A seek started during media playback
    params:
      entityId: {type: string, description: Entity ID of the media}
      target: {type: double, description: Target position of the seek}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345", target: 0.5}}]
  mediaSeeked:
    summary: A seek completed during media playback
    params:
      entityId: {type: string, description: Entity ID of the media}
      position: {type: double, description: Resulting position of the seek}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345", position: 0.51}}]
  mediaRateChanged:
    summary: The playback rate of media changed
    params:
      entityId: {type: string, description: Entity ID of the media}
      rate: {type: double, description: The new playback rate}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345", rate: 2}}]
  mediaRenditionChanged:
    summary: The playback rendition (bitrate, dimensions, profile) changed
    params:
      entityId: {type: string, description: Entity ID of the media}
      bitrate: {type: unsigned, description: The new bitrate in kbps}
      width: {type: unsigned, description: The new resolution width}
      height: {type: unsigned, description: The new resolution height}
      profile: {type: string, optional: true, description: "A description of the new profile, for example HDR"}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345", bitrate: 5000, width: 1920, height: 1080, profile: HDR+}}]
  mediaEnded:
    summary: Playback stopped because the end of the media was reached
    params:
      entityId: {type: string, description: Entity ID of the media}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {entityId: "345"}}]
  event:
    summary: Informs the platform of first party distributor metrics
    params:
      schema: {type: string, format: uri, description: The schema URI of the metric type}
      data: {type: string, format: json, description: A JSON document, as text}
      agePolicy: {type: Common.AgePolicy, optional: true}
    examples: [{params: {schema: "http://meta.rdkcentral.com/some/schema", data: "{\"key\":\"value\"}"}}]
  appInfo:
    summary: Informs the platform of the build or version of the app
    params:
      build: {type: string, description: The build or version of the app}
    examples: [{params: {build: 1.2.2}}]
