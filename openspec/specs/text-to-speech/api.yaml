# TextToSpeech contract. Field guide: openspec/README.md
# Wire names are spelled as the platform sends them, with mixed casing.
module: TextToSpeech
description: Text to speech. Deprecated; use `SpeechSynthesis`. Callers judge a call by `TTS_Status`, not by `success`.
deprecated: {in: "9.0.0", replacement: SpeechSynthesis}
types:
  SpeechId: {type: unsigned, description: Identifies one speak request}
  TTSStatus:
    type: unsigned
    description: "0 OK, 1 fail, 2 not enabled, 3 invalid configuration (Firebolt 9). The platform also sends 4, no access after setACL. Any unsigned value is accepted"
  SpeechState:
    enum: {0: PENDING, 1: IN_PROGRESS, 2: PAUSED, 3: NOT_FOUND}
    description: State of an utterance
  SpeechIdEvent:
    fields:
      speechid: {type: SpeechId, cpp_name: speechId}
  TTSStatusResponse:
    fields:
      TTS_Status: {type: TTSStatus, cpp_name: ttsStatus}
      success: {type: boolean}
  SpeechResponse:
    fields:
      speechid: {type: SpeechId, cpp_name: speechId}
      TTS_Status: {type: TTSStatus, cpp_name: ttsStatus}
      success: {type: boolean}
  SpeechStateResponse:
    fields:
      speechstate: {type: SpeechState, cpp_name: speechState}
      TTS_Status: {type: TTSStatus, cpp_name: ttsStatus}
      success: {type: boolean}
  ListVoicesResponse:
    fields:
      TTS_Status: {type: TTSStatus, cpp_name: ttsStatus}
      voices: {type: "array<string>", description: Voice names, for example ava}
methods:
  speak:
    summary: Speaks the utterance immediately. Any ongoing speech is interrupted and `onSpeechInterrupted` is raised
    params:
      text: {type: string, description: Plain text or a well-formed SSML document}
      callsign: {type: string, optional: true, description: Application call sign; the platform requires it if `setACL` was called earlier}
      language: {type: string, format: bcp47, optional: true, description: The language of the text, BCP 47}
      voice: {type: string, optional: true, description: A voice name as returned by `listvoices`}
      volume: {type: string, format: decimal, minimum: 0, maximum: 1, optional: true, description: Speaking volume, platform default 1}
      rate: {type: string, format: decimal, minimum: 0.1, maximum: 10, optional: true, description: Speaking rate, platform default 1}
      pitch: {type: string, format: decimal, minimum: 0, maximum: 2, optional: true, description: Speaking pitch, platform default 1; the platform does not support it yet}
    result: SpeechResponse
    examples:
      - params: {text: I am a text waiting for speech., callsign: AppA, language: en-US, voice: female-1, volume: "0.8", rate: "1", pitch: "1"}
        result: {speechid: 1, TTS_Status: 0, success: true}
  pause:
    summary: Pauses the speech with the given ID. Raises `onSpeechPause`; does nothing if already paused
    params:
      speechid: {type: SpeechId}
    result: TTSStatusResponse
    examples: [{params: {speechid: 1}, result: {TTS_Status: 0, success: true}}]
  resume:
    summary: Resumes the speech with the given ID. Raises `onSpeechResume`; does nothing if not paused
    params:
      speechid: {type: SpeechId}
    result: TTSStatusResponse
    examples: [{params: {speechid: 1}, result: {TTS_Status: 0, success: true}}]
  cancel:
    summary: Cancels the speech with the given ID. Raises `onSpeechInterrupted` if it was being spoken
    params:
      speechid: {type: SpeechId}
    result: TTSStatusResponse
    examples: [{params: {speechid: 1}, result: {TTS_Status: 0, success: true}}]
  getspeechstate:
    summary: Returns the state of the utterance
    cpp_name: getSpeechState
    params:
      speechid: {type: SpeechId}
    result: SpeechStateResponse
    examples: [{params: {speechid: 1}, result: {speechstate: 1, TTS_Status: 0, success: true}}]
  listvoices:
    summary: Returns the available voices as human-readable names
    cpp_name: listVoices
    params:
      language: {type: string, format: bcp47, description: The language of the voices, BCP 47}
    result: ListVoicesResponse
    examples: [{params: {language: en-US}, result: {TTS_Status: 0, voices: [carol, tom]}}]
events:
  onWillSpeak: {summary: Text to speech conversion is about to start, payload: SpeechIdEvent, examples: [{payload: {speechid: 1}}]}
  onSpeechStart: {summary: The utterance is about to be spoken, payload: SpeechIdEvent, examples: [{payload: {speechid: 1}}]}
  onSpeechPause: {summary: Ongoing speech was paused, payload: SpeechIdEvent, examples: [{payload: {speechid: 1}}]}
  onSpeechResume: {summary: Paused speech was resumed, payload: SpeechIdEvent, examples: [{payload: {speechid: 1}}]}
  onSpeechComplete: {summary: Speech completed successfully, payload: SpeechIdEvent, examples: [{payload: {speechid: 1}}]}
  onSpeechInterrupted: {summary: Speech was stopped by another speak call or by cancel, payload: SpeechIdEvent, examples: [{payload: {speechid: 1}}]}
  onNetworkError: {summary: The utterance failed due to a network error, payload: SpeechIdEvent, examples: [{payload: {speechid: 1}}]}
  onPlaybackError: {summary: The utterance failed during playback, payload: SpeechIdEvent, examples: [{payload: {speechid: 1}}]}
